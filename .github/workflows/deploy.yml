name: Build Single-File HTML & Deploy Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-release"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Cache npm directory
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Build single-file standalone HTML
        run: npx vite build --base=./

      - name: Prepare standalone & SPA fallback files
        run: |
          cp dist/index.html dist/neiroshtil.html
          cp dist/index.html dist/404.html

      - name: Publish dist/neiroshtil.html to GitHub Releases (latest-build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build dist/neiroshtil.html --clobber
            gh release edit latest-build \
              --target "${{ github.sha }}" \
              --title "НЕЙРОШТИЛЬ — Автономный HTML (latest-build)" \
              --notes "Автономная однофайловая сборка neiroshtil.html (работает офлайн через file:// и content://). Обновлено: $(date -u +'%Y-%m-%d %H:%M:%S UTC') (${GITHUB_SHA::7})."
          else
            gh release create latest-build dist/neiroshtil.html \
              --target "${{ github.sha }}" \
              --title "НЕЙРОШТИЛЬ — Автономный HTML (latest-build)" \
              --notes "Автономная однофайловая сборка neiroshtil.html (работает офлайн через file:// и content://). Сборка: $(date -u +'%Y-%m-%d %H:%M:%S UTC') (${GITHUB_SHA::7})."
          fi

      - name: Upload standalone HTML workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neiroshtil-singlefile-html
          path: dist/neiroshtil.html
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
